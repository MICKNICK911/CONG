<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midweek Schedule</title>
<style>
:root{--bg:#fff;--fg:#1c1c1a;--mut:#6b6a64;--bd:#dcdad3;--card:#fff;--sec:#f4f3ef;--abg:#e6f1fb;--afg:#0c447c;--abd:#85b7eb;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--fg:#ecebe6;--mut:#a3a199;--bd:#3d3c37;--card:#242422;--sec:#2e2d2a;--abg:#0c2a45;--afg:#b5d4f4;--abd:#378add;--bad:#f2b8b5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(80px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}
h1{font-size:18px;margin:0 0 12px;font-weight:600}h2{font-size:15px;margin:18px 0 8px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;cursor:pointer}
input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;height:38px;padding:0 8px;width:100%}
input[type=checkbox]{width:auto;height:auto}
.tabs{display:flex;gap:8px;margin:0 0 10px;overflow-x:auto}.tab{flex:1;min-width:110px;height:40px;font-size:14px}
.on{background:var(--abg);color:var(--afg);border-color:var(--abd);font-weight:500}
#leg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{height:32px;padding:0 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px;border-radius:16px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.bar2{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;gap:8px}.bar2 button{height:34px;padding:0 12px;font-size:13px}
.card{border:1px solid var(--bd);border-radius:12px;padding:10px 10px 4px;margin:0 0 12px;background:var(--card)}
.wk{font-size:14px;font-weight:600;margin:0 0 8px 2px}
.sec{border:1px solid var(--bd);border-radius:8px;margin:0 0 8px;overflow:hidden}
.hd{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;padding:6px 10px;border:none;border-radius:0;background:var(--sec);text-align:left}
.bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.hl{flex:1;min-width:0;font-size:13px;font-weight:600}.mini{display:flex;gap:3px}
.chev{color:var(--mut);transition:transform .15s}.chev.o{transform:rotate(180deg)}
.row{padding:8px 10px;border-top:1px solid var(--bd)}
.rt{display:flex;gap:8px;font-size:13px}.num{width:16px;color:var(--mut);flex:none}
.ra{display:flex;align-items:center;gap:8px;margin:6px 0 0 24px;flex-wrap:wrap}
.bd{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 8px;border-radius:10px;background:var(--sec);border:1px solid var(--bd)}
.nm{height:32px;padding:0 12px;font-size:13px;border-radius:16px;min-width:96px;text-align:left}
.nm.empty{color:var(--mut);border-style:dashed}.nm.half{border-color:#EF9F27}
.note{font-size:13px;color:var(--mut);margin:4px 2px 8px}
.tg{display:flex;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px;font-size:12px;border-radius:18px}
.trk{width:30px;height:18px;border-radius:9px;background:var(--bd);position:relative;flex:none}
.trk::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--card);transition:transform .15s}
.sw[aria-checked=true] .trk{background:#1D9E75}.sw[aria-checked=true] .trk::after{transform:translateX(12px)}
.ev{font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;background:var(--abg);color:var(--afg);margin-left:6px}
.det{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px}.det input:first-child{grid-column:1/-1}
.del{border:none;color:var(--mut);font-size:12px;padding:6px 2px;background:none}
.lst{display:flex;flex-direction:column;gap:6px}.pr{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;flex-wrap:wrap}
.pr b{flex:1;min-width:100px;font-weight:500}.cc{height:28px;padding:0 9px;font-size:12px;border-radius:14px}
.f{display:grid;gap:6px;margin:0 0 10px}.f label{font-size:12px;color:var(--mut)}
.big{height:44px;font-weight:500;width:100%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);max-width:560px;margin:0 auto}
.nv{flex:1;height:44px;font-size:12px;padding:0 2px}
.sw2{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}.st{border-collapse:separate;border-spacing:0;font-size:11px}.st th,.st td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:0;min-width:54px;height:30px;text-align:center}.st th{background:var(--sec);font-weight:500;padding:4px 3px;line-height:1.2}.st .nc{position:sticky;left:0;z-index:1;min-width:110px;max-width:130px;text-align:left;padding:0 8px;background:var(--bg);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st th.nc{background:var(--sec);z-index:2}.st td.cvc{background:var(--sec)}.st td.tot{font-weight:600;font-size:12px}.sl{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px;font-size:12px}.sl span{display:inline-flex;align-items:center;gap:5px}.sl i{width:16px;height:12px;border-radius:3px;display:inline-block}
#sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}#sheet.open{display:flex;align-items:flex-end}
.sh{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}.shh b{font-size:15px}.shh button{height:34px;padding:0 12px}
.ch2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.ch2 button{height:44px;padding:0 18px}
.slot{flex:1;height:40px;font-size:13px}
.pn{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;padding:6px 12px;text-align:left;margin-bottom:6px}
.pn small{color:var(--mut);font-size:11px}.pn:disabled{opacity:.5;cursor:not-allowed}.cnt{font-weight:600;font-size:13px}
.warn{color:var(--bad);font-size:12px}
.vn{font-size:13px;font-weight:500}.vn.empty{color:var(--mut);font-weight:400}
body.vw{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}body.vw nav{display:none}
textarea.cb{width:100%;height:90px;margin-top:8px;font:11px/1.3 monospace;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px}
#print{display:none}
@media print{
 @page{size:letter;margin:.5in .55in}
 body{padding:0;max-width:none;color:#000;background:#fff}#app,#sheet,nav{display:none!important}#print{display:block}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pg{font:11px/1.25 Tahoma,Verdana,sans-serif;break-after:page;position:relative;min-height:9.7in}.pg:last-child{break-after:auto}
 .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double #000;padding-bottom:3px;margin-bottom:8px}.ph b{font-size:11px}.ph span{font:bold 17px Georgia,serif}
 .wk2{margin-bottom:22px}.dl{font-weight:bold;font-size:11px}
 table{width:100%;border-collapse:collapse}td{padding:2px 3px;vertical-align:top}
 .tm{width:7%;font-size:9px;color:#333}.lb{width:20%;text-align:right;font-size:8.5px;color:#555;font-weight:bold}.nm2{width:25%}
 .bar2p{color:#fff;font-weight:bold;font-size:9.5px;padding:2px 6px;width:56%}.b1{background:#595959}.b2{background:#bf8f00}.b3{background:#7b0f2e}
 .cvb{border:1px solid #000;padding:14px;text-align:center;font-weight:bold;margin-top:6px}
 .pf{position:absolute;bottom:0;font-size:9px}
}
</style>
</head>

<nav>

</nav>
<div id="sheet"></div>
<div id="print"></div>
<script src="libs/jszip.min.js"></script>
<script>

function $(i){return document.getElementById(i)}

/* storage (IndexedDB) */

 mn.forEach(function(x){I.push(it(x[0],x[1],x[2],2))});

function seed(){
 var sc3=['sc','Starting a Conversation',3],sc4=['sc','Starting a Conversation',4],fu=['fu','Following Up',4],md=['md','Making Disciples',5],tk=['tk','Talk',5],ww=['ww','What Would You Say?',5];
 var L=function(t){return['liv',t]},N=['ln','Local Needs'];
 return{settings:{cong:'',start:'19:00',adj:true,conc:true},people:[],lastBackup:'',weeks:[
 mkWeek('2026-11-02','Help Others Benefit From…',[sc3,fu,md],L('Never Forget What Jehovah…')),
 mkWeek('2026-11-09','Learn From the Warning…',[sc3,sc4,tk],L('Our Donations Glorify God’s…')),
 mkWeek('2026-11-16','An Understandable Response…',[sc3,fu,ww],L('Do Not Forget Our Inactive…'),0,1),
 mkWeek('2026-11-23','Do Not Give Out When…',[sc3,sc4,tk],L('Help Caregivers Not to Give…')),
 mkWeek('2026-11-30','Keep Pace With Jehovah’s…',[sc3,md,['tk','Talk',4]],N,1),
 mkWeek('2026-12-07','Why We Preach Fearlessly',[sc3,sc4,md],N),
 mkWeek('2026-12-14','Idolaters Break Jehovah’s…',[sc3,fu,ww],L('Why Refrain From…')),

function keyOf(w,i){if(w.cv)return null;if(w.co&&i.ty==='cbs')return'C.O Talk';return PRE[i.ty]||'Eld-Ms'}
function vis(w){return w.co?w.items.filter(function(i){return i.ty!=='rd'}):w.items}
function nums(w){var n=0;return w.items.map(function(i){return i.sec>0&&i.ty!=='rd'?++n:0})}
function ttl(w,i){var t=(w.co&&i.ty==='cbs')?'Circuit Overseer First Talk':i.t;return t+(i.m?' ('+i.m+' min.)':'')}

/* rules + usage */
function wkOf(mon){return S.weeks.filter(function(w){return w.mon===mon})[0]}
function has(w,name){return w&&!w.cv&&vis(w).some(function(i){return i.n.indexOf(name)>-1})}
function conflict(w,i,name){
 if(i.n.indexOf(name)>-1)return'Already in this pair';
 if(S.settings.conc&&vis(w).some(function(o){return o!==i&&o.n.indexOf(name)>-1}))return'Already has a part this week';

 return''}

 ['sched','people','create','stats','set'].forEach(function(v){$('n_'+v).className='nv'+(view===v?' on':'')});
 $('ttl').textContent=S.settings.cong||'Midweek schedule';

 var ms=months();if(!ms.length){box.appendChild(el('p','note',VIEW?'No schedule has been published yet.':'No weeks yet. Open Create to add some.'));return}

 var ws=S.weeks.filter(function(w){return w.mon.slice(0,7)===ms[mi]}),cnt={};

 var lg=el('div');lg.id='leg';Object.keys(cnt).forEach(function(k){var b=el('button','chip'+(sel===k?' on':''));b.appendChild(dot(k));b.appendChild(document.createTextNode(k+' · '+cnt[k]));b.onclick=function(){sel=sel===k?null:k;render()};lg.appendChild(b)});box.appendChild(lg);
 var bar=el('div','bar2'),pb=el('button','','Print month'),ea=el('button','',all?'Collapse all':'Expand all');

 SEC.forEach(function(sc,si){

  if(o){
   if(si===0&&!sel&&!VIEW){var d=el('div','det'),bi=el('input');bi.placeholder='Weekly Bible reading';bi.value=w.bible||'';bi.oninput=function(){w.bible=bi.value;save()};d.appendChild(bi);
    for(var q=0;q<3;q++)(function(q){var e=el('input');e.type='number';e.placeholder='Song '+(q+1);e.value=w.songs[q]||'';e.oninput=function(){w.songs[q]=e.value;save()};d.appendChild(e)})(q);s.appendChild(d)}
   rows.forEach(function(p){s.appendChild(row(w,p[0],nn[p[1]]))})}
  c.appendChild(s)});

function row(w,i,n){

 if(k){var a=el('div','ra');a.appendChild(badge(k));if(VIEW){var vt=i.n.filter(Boolean).join(' & ');a.appendChild(el('span','vn'+(vt?'':' empty'),vt||'—'))}else{var tx=nmText(i),b=el('button','nm'+(tx?(tx.slice(-1)==='…'?' half':''):' empty'),tx||'Assign');b.onclick=function(){ui.p={w:w,i:i,slot:0,cat:null,back:false};drawSheet()};a.appendChild(b)}r.appendChild(a)}
 return r}
/* picker sheet */
function drawSheet(){
 var sh=$('sheet'),p=ui.p;sh.innerHTML='';if(!p){sh.className='';return}

 var w=p.w,i=p.i,k=keyOf(w,i),cats=k.split('-'),box=el('div','sh'),hh=el('div','shh');

function shXml(rows){return'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows.map(function(r,y){return'<row r="'+(y+1)+'">'+r.map(function(v,x){var a=colL(x)+(y+1);return v===''||v==null?'':typeof v==='number'?'<c r="'+a+'"><v>'+v+'</v></c>':'<c r="'+a+'" t="inlineStr"><is><t xml:space="preserve">'+esc(v)+'</t></is></c>'}).join('')+'</row>'}).join('')+'</sheetData></worksheet>'}
function xlsxExport(){
 if(typeof JSZip==='undefined'){alert('libs/jszip.min.js is missing.');return}
 var sc=[['Week start','Convention','C.O','Bible reading','Songs','Section','Type','Title','Min','Key','Group','Assigned']];
 S.weeks.forEach(function(w){w.items.forEach(function(i){sc.push([w.mon,w.cv?'Y':'',w.co?'Y':'',w.bible||'',w.songs.join('/'),SEC[i.sec].n,i.ty,i.t,i.m||'',(w.co&&i.ty==='cbs')?'C.O Talk':(PRE[i.ty]||'Eld-Ms'),i.c||'',i.n.filter(Boolean).join(' & ')])})});
 var pe=[['Name'].concat(CATS)];S.people.forEach(function(p){pe.push([p.name].concat(CATS.map(function(c){return p.cats.indexOf(c)>-1?'x':''})))});
 var R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',z=new JSZip();
 z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>');
 z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="'+R+'/officeDocument" Target="xl/workbook.xml"/></Relationships>');
 z.file('xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="'+R+'"><sheets><sheet name="Schedule" sheetId="1" r:id="rId1"/><sheet name="People" sheetId="2" r:id="rId2"/></sheets></workbook>');
 z.file('xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="'+R+'/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="'+R+'/worksheet" Target="worksheets/sheet2.xml"/></Relationships>');
 z.file('xl/worksheets/sheet1.xml',shXml(sc));z.file('xl/worksheets/sheet2.xml',shXml(pe));
 z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}).then(function(b){var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='mwb-schedule-'+iso(new Date())+'.xlsx';a.click();setTimeout(function(){URL.revokeObjectURL(u)},2000)})}
async function readXlsx(file){
 var z=await JSZip.loadAsync(file),P=new DOMParser(),rd=async function(p){var f=z.file(p);return f?P.parseFromString(await f.async('string'),'application/xml'):null},ss=[],sd=await rd('xl/sharedStrings.xml');
 if(sd)Array.from(sd.getElementsByTagName('si')).forEach(function(si){ss.push(Array.from(si.getElementsByTagName('t')).map(function(t){return t.textContent}).join(''))});
 var wb=await rd('xl/workbook.xml'),rl=await rd('xl/_rels/workbook.xml.rels'),map={},out={};
 Array.from(rl.getElementsByTagName('Relationship')).forEach(function(r){map[r.getAttribute('Id')]=r.getAttribute('Target')});
 for(var s of Array.from(wb.getElementsByTagName('sheet'))){var t=(map[s.getAttribute('r:id')]||'').replace(/^\//,'');if(!/^xl\//.test(t))t='xl/'+t;var d=await rd(t),rows=[];if(!d)continue;
  Array.from(d.getElementsByTagName('c')).forEach(function(c){var m=c.getAttribute('r').match(/^([A-Z]+)(\d+)$/),x=0,ty=c.getAttribute('t'),v;m[1].split('').forEach(function(ch){x=x*26+ch.charCodeAt(0)-64});
   if(ty==='inlineStr')v=Array.from(c.getElementsByTagName('t')).map(function(q){return q.textContent}).join('');else{var ve=c.getElementsByTagName('v')[0];v=ve?ve.textContent:'';if(ty==='s')v=ss[+v]||''}
   var y=m[2]-1;(rows[y]=rows[y]||[])[x-1]=v});out[s.getAttribute('name')]=rows}
 return out}
function dateOf(v){v=String(v||'').trim();if(/^\d{5}$/.test(v))return monOf(iso(new Date(Date.UTC(1899,11,30)+(+v)*864e5)));return/^\d{4}-\d\d-\d\d/.test(v)?monOf(v.slice(0,10)):''}
function applyXlsx(o){
 var np=0,nw=0,by={},ord=[];
 (o.People||[]).slice(1).forEach(function(r){var n=String(r&&r[0]||'').trim();if(!n)return;var cats=CATS.filter(function(c,i){return String(r[i+1]||'').trim()!==''}),p=S.people.filter(function(x){return x.name.toLowerCase()===n.toLowerCase()})[0];if(p)p.cats=cats;else S.people.push({name:n,cats:cats});np++});
 (o.Schedule||[]).slice(1).forEach(function(r){var mon=r&&dateOf(r[0]);if(!mon||!r[6])return;
  if(!by[mon]){by[mon]={id:'w'+mon,mon:mon,cv:r[1]==='Y',co:r[2]==='Y',bible:r[3]||'',songs:String(r[4]||'//').split('/').concat(['','']).slice(0,3),items:[]};ord.push(mon)}
  var sec=SEC.map(function(s){return s.n}).indexOf(r[5]),ty=r[6];if(sec<0)sec=/^(ch|pr)$/.test(ty)?0:/^t[123]$/.test(ty)?1:/^(sc|fu|md|tk|ww|eb|x)$/.test(ty)?2:3;
  by[mon].items.push({ty:ty,t:r[7]||'',m:+r[8]||null,sec:sec,n:String(r[11]||'').split(/\s*&\s*/).filter(Boolean),c:r[10]||''})});
 ord.forEach(function(m){var old=wkOf(m);if(old)S.weeks.splice(S.weeks.indexOf(old),1);S.weeks.push(by[m]);nw++});
 S.weeks.sort(function(a,b){return a.mon<b.mon?-1:1});save();mi=0;alert('Imported '+nw+' weeks and '+np+' people.');go('sched')}
/* statistics */
var D2='#7fd1b4',DS='repeating-linear-gradient(45deg,#1D9E75 0 3px,#bfeadb 3px 6px)';
function bgOf(a){if(a.length===1)return a[0]===D2?DS:a[0];var st=a.map(function(c,i){c=c===D2?DS.match(/#bfeadb/)[0]:c;return c+' '+(i*100/a.length)+'% '+((i+1)*100/a.length)+'%'});return'linear-gradient(90deg,'+st.join(',')+')'}
function statsView(box){
 var ws=S.weeks;if(!ws.length){box.appendChild(el('p','note','No weeks yet.'));return}
 var map={},tot={};
 ws.forEach(function(w){if(w.cv)return;vis(w).forEach(function(i){var k=keyOf(w,i)||'',c=i.c||k.split('-')[0];
  i.n.forEach(function(n,x){if(!n)return;var col=c==='Duet'?(x===0?KC.Duet:D2):(KC[c]||'#888');var m=map[n]=map[n]||{};(m[w.id]=m[w.id]||[]).push(col);tot[n]=(tot[n]||0)+1})})});
 var names=S.people.map(function(p){return p.name});Object.keys(map).forEach(function(n){if(names.indexOf(n)<0)names.push(n)});
 names.sort(function(a,b){return a.localeCompare(b)});
 var lg=el('div','sl');[['Pub',KC.Pub],['Eld',KC.Eld],['Ms',KC.Ms],['LN',KC.LN],['Duet (first name)',KC.Duet],['Duet (second name)',DS],['C.O Talk',KC['C.O Talk']]].forEach(function(x){var s=el('span'),i=el('i');i.style.background=x[1];s.appendChild(i);s.appendChild(document.createTextNode(x[0]));lg.appendChild(s)});box.appendChild(lg);
 if(!names.length){box.appendChild(el('p','note','Add people and assign names to see the chart.'))}
 var wrap=el('div','sw2'),t=el('table','st'),h1=el('tr'),h2=el('tr'),th=el('th','nc','Name');th.rowSpan=2;h1.appendChild(th);
 var g=null;ws.forEach(function(w){var k=w.mon.slice(0,7);if(g&&g.k===k)g.n++;else{g={k:k,n:1,th:el('th','',mname(k))};h1.appendChild(g.th)}g.th.colSpan=g.n;
  var c=el('th','',lab(w).replace(/^[A-Za-z]+ /,'').replace(' - ','–'));if(w.cv)c.appendChild(el('div','','Conv.'));h2.appendChild(c)});
 var tt=el('th','','Total');tt.rowSpan=2;h1.appendChild(tt);
 var hd=el('thead');hd.appendChild(h1);hd.appendChild(h2);t.appendChild(hd);
 var tb=el('tbody');names.forEach(function(n){var r=el('tr');r.appendChild(el('td','nc',n));
  ws.forEach(function(w){var c=el('td',w.cv?'cvc':''),a=(map[n]||{})[w.id];if(a){c.style.background=bgOf(a);c.title=n+' · '+lab(w)}r.appendChild(c)});
  r.appendChild(el('td','tot',tot[n]||0));tb.appendChild(r)});
 t.appendChild(tb);wrap.appendChild(t);box.appendChild(wrap)}
/* viewer mode (temporary, until there is a backend) */
function isViewer(){
 var h=location.hash.toLowerCase(),f=0;
 try{if(h==='#mickydcoder')localStorage.setItem('mwb-admin','1');if(h==='#viewer')localStorage.removeItem('mwb-admin');f=localStorage.getItem('mwb-admin')==='1'}catch(e){}
 if(!PUBLISHED||!PUBLISHED.weeks)return false;
 if(h==='#viewer')return true;
 return!(h==='#mickydcoder'||f)}
function nowMonth(){var ms=months(),k=iso(new Date()).slice(0,7);for(var x=0;x<ms.length;x++)if(ms[x]>=k)return x;return Math.max(0,ms.length-1)}
function pubCode(){
 var o={at:iso(new Date()),settings:{cong:S.settings.cong,start:S.settings.start},weeks:S.weeks};
 return'/*PUBLISHED_START*/var PUBLISHED='+JSON.stringify(o).replace(/</g,'\\u003c')+';/*PUBLISHED_END*/'}
function copyText(t){
 function fb(){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.focus();a.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(a);return ok}
 if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).then(function(){return true},function(){return fb()});
 return Promise.resolve(fb())}
function shareBox(box){
 box.appendChild(el('h2','','Share with viewers'));
 box.appendChild(el('p','note',PUBLISHED?'Published copy in the code: '+(PUBLISHED.at||'?')+', '+(PUBLISHED.weeks||[]).length+' weeks.':'Nothing published yet. Until you paste viewer code, everyone sees this editor.'));
 box.appendChild(el('p','note','Copy the code, then in index.html replace the whole line that starts with /*PUBLISHED_START*/ with it, and redeploy. Visitors then get a read-only schedule. To edit on your own device, open the site with #mickydcoder on the end of the address (#viewer switches back).'));
 var b=el('button','big','Copy viewer code'),out=el('textarea','cb');out.readOnly=true;out.style.display='none';
 b.onclick=function(){var c=pubCode();copyText(c).then(function(ok){
  if(ok){out.style.display='none';b.textContent='Copied ✓ '+S.weeks.length+' weeks';setTimeout(function(){b.textContent='Copy viewer code'},2500)}
  else{out.value=c;out.style.display='block';out.focus();out.select();alert('Could not copy automatically. The code is shown below: select it all and copy.')}})};
 box.appendChild(b);box.appendChild(out);
 if(PUBLISHED&&PUBLISHED.weeks){var rb=el('button','big','Restore from published copy');rb.style.marginTop='8px';
  rb.onclick=function(){if(!confirm('Replace the weeks and settings in this editor with the published copy from '+(PUBLISHED.at||'the code')+'? Your People list is kept.'))return;
   S.weeks=JSON.parse(JSON.stringify(PUBLISHED.weeks));S.settings=Object.assign(S.settings,PUBLISHED.settings||{});save();mi=0;go('sched')};
  box.appendChild(rb)}}
/* start */
function start(){S.settings=Object.assign({cong:'',start:'19:00',adj:true,conc:true},S.settings);S.weeks.sort(function(a,b){return a.mon<b.mon?-1:1});render()}
VIEW=isViewer();window.onhashchange=function(){location.reload()};
if(VIEW){document.body.className='vw';S={at:PUBLISHED.at||'',settings:Object.assign({cong:'',start:'19:00'},PUBLISHED.settings),people:[],weeks:PUBLISHED.weeks};all=true;mi=nowMonth();start()}
else load().then(function(x){S=x||seed();start()}).catch(function(){S=seed();start()});
</script>
