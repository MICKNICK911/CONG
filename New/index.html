*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(80px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}

input[type=checkbox]{width:auto;height:auto}
.tabs{display:flex;gap:8px;margin:0 0 10px;overflow-x:auto}.tab{flex:1;min-width:110px;height:40px;font-size:14px}

.note{font-size:13px;color:var(--mut);margin:4px 2px 8px}

.trk{width:30px;height:18px;border-radius:9px;background:var(--bd);position:relative;flex:none}
.trk::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--card);transition:transform .15s}
.sw[aria-checked=true] .trk{background:#1D9E75}.sw[aria-checked=true] .trk::after{transform:translateX(12px)}
.ev{font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;background:var(--abg);color:var(--afg);margin-left:6px}
.det{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px}.det input:first-child{grid-column:1/-1}
.del{border:none;color:var(--mut);font-size:12px;padding:6px 2px;background:none}

.f{display:grid;gap:6px;margin:0 0 10px}.f label{font-size:12px;color:var(--mut)}
.big{height:44px;font-weight:500;width:100%}

.nv{flex:1;height:44px;font-size:12px;padding:0 2px}
.sw2{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}.st{border-collapse:separate;border-spacing:0;font-size:11px}.st th,.st td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:0;min-width:54px;height:30px;text-align:center}.st th{background:var(--sec);font-weight:500;padding:4px 3px;line-height:1.2}.st .nc{position:sticky;left:0;z-index:1;min-width:110px;max-width:130px;text-align:left;padding:0 8px;background:var(--bg);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st th.nc{background:var(--sec);z-index:2}.st td.cvc{background:var(--sec)}.st td.tot{font-weight:600;font-size:12px}

.st .m0{--mt:#eef4fb;--mh:#dbe8f6;--me:#a9c4e0}
.st .m1{--mt:#fcf6ea;--mh:#f6e8c9;--me:#dcc088}
.st .m2{--mt:#ecf5ee;--mh:#d7ecdb;--me:#a9c9af}

.st .m4{--mt:#fdf1ed;--mh:#f8ddd5;--me:#e0b1a1}
.st .m5{--mt:#eaf5f5;--mh:#d3ebe9;--me:#a0cbc6}

 .st .m0{--mt:#1a2330;--mh:#22344a;--me:#3d5a7a}

 .st .m2{--mt:#1c2820;--mh:#2a3d30;--me:#4a7a55}

}
.st th.mhd{background:var(--mh)}
.st td.mt-empty{background:var(--mt)}
.st .mfirst{border-left:2px solid var(--me)}.st tr.gh th{height:26px;font-size:11px;font-weight:600;text-align:left;padding:0 8px;background:var(--sec)}.st tr.gh th.nc{font-size:12px}.sl{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px;font-size:12px}.sl span{display:inline-flex;align-items:center;gap:5px}.sl i{width:16px;height:12px;border-radius:3px;display:inline-block}

.sh{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}.shh b{font-size:15px}.shh button{height:34px;padding:0 12px}
.sbox{position:relative;margin:8px 0}
.sbox input{padding-right:38px}
.sbox .sclr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:none;background:none;font-size:18px;line-height:1;color:var(--mut);cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}

.ch2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.ch2 button{height:44px;padding:0 18px}

.vn{font-size:13px;font-weight:500}.vn.empty{color:var(--mut);font-weight:400}

.wkgrid{display:block}

}
